<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>


<header
    th:fragment="header"
    class="topbar">


    <div class="brand">

        <a th:href="@{/}">
            IOTSTAR SHOP
        </a>

    </div>


    <nav>

        <a th:href="@{/}">
            Home
        </a>


        <a
            sec:authorize="hasRole('ADMIN')"
            th:href="@{/dashboard}">

            Dashboard

        </a>

    </nav>


    <div
        class="account"
        sec:authorize="isAuthenticated()">


        <span>
            Xin chào:
        </span>


        <strong
            sec:authentication="name">

            user@email.com

        </strong>


        <form
            th:action="@{/logout}"
            method="post"
            style="display:inline">


            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <button
                type="submit"
                class="link-button">

                Đăng xuất

            </button>


        </form>

    </div>


    <div
        class="account"
        sec:authorize="!isAuthenticated()">

        <a th:href="@{/login}">
            Đăng nhập
        </a>

    </div>


</header>


</body>

</html>
